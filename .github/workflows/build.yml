name: MineCPP 1.0.0 — build and tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libglfw3-dev libgl1-mesa-dev zlib1g-dev
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install glfw zlib
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: vcpkg install glfw3:x64-windows-static zlib:x64-windows-static
      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static
      - name: Configure Unix
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload Linux binaries
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: MineCPP-1.0.0-Linux-${{ runner.arch }}
          path: |
            build/minecpp-launcher
            build/minecpp
          if-no-files-found: error
      - name: Upload macOS binaries
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: MineCPP-1.0.0-macOS-${{ runner.arch }}
          path: |
            build/minecpp-launcher
            build/minecpp
          if-no-files-found: error
      - name: Upload Windows binaries
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: MineCPP-1.0.0-Windows-${{ runner.arch }}
          path: |
            build/Release/minecpp-launcher.exe
            build/Release/minecpp.exe
          if-no-files-found: error
